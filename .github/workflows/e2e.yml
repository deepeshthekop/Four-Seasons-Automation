name: E2E validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Tuesday at 11:17 UTC; example weekly production-site check.
    - cron: "17 11 * * 2"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run E2E test
        id: e2e
        run: npm run wdio

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: artifacts/
          if-no-files-found: ignore
